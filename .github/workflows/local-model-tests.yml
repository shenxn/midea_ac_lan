name: Local model regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked --no-default-groups --group test
      - run: uv run --no-sync pytest --cov=custom_components.midea_ac_lan --cov-report=term-missing
